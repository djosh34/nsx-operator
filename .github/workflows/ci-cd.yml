name: CI/CD

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nsx-operator
  LOCAL_IMAGE: nsx-operator:ci

jobs:
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "Building ${LOCAL_IMAGE} from Dockerfile for ${GITHUB_SHA}"
          docker buildx build \
            --file Dockerfile \
            --tag "${LOCAL_IMAGE}" \
            --output "type=docker,dest=${RUNNER_TEMP}/nsx-operator-image.tar" \
            .
          ls -lh "${RUNNER_TEMP}/nsx-operator-image.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsx-operator-image
          path: ${{ runner.temp }}/nsx-operator-image.tar
          if-no-files-found: error
          retention-days: 1

  go-test:
    name: Go test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout sibling mock API
        shell: bash
        run: |
          set -euo pipefail
          echo "Cloning sibling nsx-t-mockapi repository for contract tests"
          git clone --depth=1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/nsx-t-mockapi.git" ../nsx-t-mockapi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run strict standard lint
        shell: bash
        run: |
          set -euo pipefail
          echo "Running strict standard lint with make lint"
          make lint

      - name: Run project analyzer lint
        shell: bash
        run: |
          set -euo pipefail
          echo "Running custom project analyzers with make project-lint"
          make project-lint

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          echo "Running full Go tests with make test"
          make test

      - name: Run Go race tests
        shell: bash
        run: |
          set -euo pipefail
          echo "Running Go race tests with make test-race"
          make test-race

      - name: Run contract tests
        shell: bash
        run: |
          set -euo pipefail
          echo "Running contract tests with make test-contract"
          make test-contract

      - name: Run focused e2e tests
        shell: bash
        run: |
          set -euo pipefail
          echo "Running focused e2e tests with make test-e2e"
          make test-e2e

      - name: Run large chaos tests
        shell: bash
        run: |
          set -euo pipefail
          echo "Running large chaos tests with make test-large-chaos"
          make test-large-chaos

      - name: Run coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          echo "Running coverage threshold with make test-coverage"
          make test-coverage

  publish-ghcr:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - docker-build
      - go-test
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: nsx-operator-image
          path: ${{ runner.temp }}/image

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load, tag, and push image
        shell: bash
        run: |
          set -euo pipefail
          image_tar="${RUNNER_TEMP}/image/nsx-operator-image.tar"
          echo "Loading image artifact from ${image_tar}"
          docker load --input "${image_tar}"

          echo "Publishing image tags:"
          while IFS= read -r tag; do
            if [[ -z "${tag}" ]]; then
              continue
            fi
            echo "  ${tag}"
            docker tag "${LOCAL_IMAGE}" "${tag}"
            docker push "${tag}"
          done <<'EOF_TAGS'
          ${{ steps.meta.outputs.tags }}
          EOF_TAGS
