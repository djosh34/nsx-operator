# Serves the group viewer on 127.0.0.1:18090 and proxies /policy/ to the NSX-T mock API.
# The mock keeps state per Host header, so send the same Host the operator uses.
server {
    listen 80;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location /policy/ {
        limit_except GET { deny all; }
        proxy_pass http://nsx-t-mockapi:8080;
        proxy_set_header Host 127.0.0.1:18080;
        # nsx_admin:nsx_password, the mock API's demo credentials
        proxy_set_header Authorization "Basic bnN4X2FkbWluOm5zeF9wYXNzd29yZA==";
    }
}
